<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Galactica</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game">
    <div class="top-bar">Echo Galactica</div>

    <div class="left-menu">
      <button data-menu="command" class="active">Command Center</button>
      <button data-menu="systems">Systems</button>
      <button data-menu="construction">Build</button>
      <button data-menu="shipyard">Shipyard</button>
      <button data-menu="fleet">Fleet</button>
      <button data-menu="research">Research</button>
      <button data-menu="missions">Missions</button>
      <button data-menu="market">Market</button>
      <button data-menu="profile">Profile</button>
      <button data-menu="settings">Settings</button>
    </div>

    <main id="mainPanel" class="main-panel"></main>

    <div class="panel-minimap" id="minimap"></div>
    <div class="panel-info" id="panelInfo"></div>
    <div class="panel-galaxy" id="panelGalaxy"></div>
    <div class="panel-comms" id="panelComms"></div>

    <div class="bottom-menu">
      <button data-menu="galaxy">Galaxy Map</button>
      <button data-menu="systems">Systems</button>
      <button data-menu="construction">Build</button>
      <button data-menu="defense">Defense</button>
      <button data-menu="technology">Tech</button>
      <button data-menu="fleet">Fleet</button>
    </div>
  </div>

  <script src="js/indexgame.js"></script>
</body>
</html>
